<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Lívia Cred Saúde CRM</title>
    <meta name="description" content="CRM e gestão operacional de correspondente de crédito consignado: propostas, comissões de promotoras, metas, ranking e rentabilidade." />
    <meta property="og:title" content="Lívia Cred Saúde CRM" />
    <meta property="og:description" content="CRM e gestão operacional de correspondente de crédito consignado: propostas, comissões de promotoras, metas, ranking e rentabilidade." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0B2A4A" />
    <meta name="background-color" content="#0B2A4A" />
    <meta name="msapplication-navbutton-color" content="#0B2A4A" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lívia Cred" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      /* Smooth launch screen styles */
      body, html {
        margin: 0;
        padding: 0;
        background-color: #0B2A4A;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .app-splash-container {
        min-height: 100vh;
        min-height: 100dvh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center top, #14426E 0%, #0B2A4A 65%, #07192D 100%);
        box-sizing: border-box;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }
      .app-splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: splashFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .app-splash-logo {
        width: 88px;
        height: 88px;
        border-radius: 26px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 0 1.5px rgba(255, 215, 0, 0.3);
        object-fit: cover;
        margin-bottom: 20px;
      }
      .app-splash-title {
        color: #FFFFFF;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 6px 0;
      }
      .app-splash-sub {
        color: #5EEAD4;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin: 0 0 28px 0;
        opacity: 0.9;
      }
      .app-splash-loader {
        width: 120px;
        height: 4px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .app-splash-loader-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, #F5B700, #5EEAD4);
        border-radius: 9999px;
        animation: splashShimmer 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes splashFadeIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes splashShimmer {
        0% { left: -45%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body class="antialiased selection:bg-teal-500/20 selection:text-teal-900 min-h-screen">
    <div id="root">
      <div class="app-splash-container">
        <div class="app-splash-card">
          <img src="/pwa-192x192.png" alt="Lívia Cred" class="app-splash-logo" />
          <h1 class="app-splash-title">Lívia Cred CRM</h1>
          <p class="app-splash-sub">Soluções em Crédito</p>
          <div class="app-splash-loader">
            <div class="app-splash-loader-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
